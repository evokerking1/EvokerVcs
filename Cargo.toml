[package]
name = "evokervcs"
version = "0.1.0"
edition = "2021"
authors = ["EvokerVcs Contributors"]
description = "A custom git-like version control system with TUI and git compatibility"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
git2 = "0.19"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
flate2 = "1.0"
anyhow = "1.0"
